<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Send to Claudian 设置</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    textarea { height: 140px; font-family: ui-monospace, Consolas, monospace; }
    .hint { color: #666; font-size: 12px; margin-top: 4px; }
    .row { margin-top: 20px; display: flex; gap: 8px; align-items: center; }
    #status { margin-left: 8px; }
  </style>
</head>
<body>
  <h2>Send to Claudian 设置</h2>

  <label for="port">端口</label>
  <input id="port" type="number" min="1" max="65535">

  <label for="token">Token</label>
  <input id="token" type="text" placeholder="从 Obsidian → 设置 → Claudian Bridge 复制">

  <label for="template">提示词模板</label>
  <textarea id="template"></textarea>
  <div class="hint">可用占位符：{{text}} 选中文字、{{title}} 网页标题、{{url}} 网页地址</div>

  <div class="row">
    <button id="save">保存</button>
    <button id="test">测试连接</button>
    <button id="reset">恢复默认模板</button>
    <span id="status"></span>
  </div>

  <script src="config.js"></script>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
